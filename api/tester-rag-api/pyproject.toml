[project]
name = "my_fastapi_agent"
version = "0.1.0"
description = "Agentic test generator"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "aiosqlite",
    "tree-sitter",
    "tree-sitter-python",
    "qdrant-client",
    "python-dotenv",
    "openai",
    "anthropic",
    "httpx",
    "jira"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

# Without this, setuptools' auto-discovery sees a flat layout with several
# top-level candidates (app, tests, main.py) and refuses to guess, which makes
# `pip install -e .` fail. Naming the package explicitly settles it.
[tool.setuptools.packages.find]
include = ["app*"]

# The API tests import `from main import app`, so the entrypoint module ships too.
[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
